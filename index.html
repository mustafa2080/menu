<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>منيو السحور والمشروبات</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --accent-gold: #d4a574;
      --accent-warm: #e8c39e;
      --text-primary: #f8f4ef;
      --text-muted: #8b949e;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border-color: rgba(212, 165, 116, 0.2);
      --glow-gold: rgba(212, 165, 116, 0.4);
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Animated Background */
    .bg-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    
    .bg-pattern::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, var(--glow-gold) 0%, transparent 60%);
      animation: floatGlow 15s ease-in-out infinite;
    }
    
    .bg-pattern::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -30%;
      width: 80%;
      height: 80%;
      background: radial-gradient(ellipse at center, rgba(139, 69, 19, 0.15) 0%, transparent 60%);
      animation: floatGlow 20s ease-in-out infinite reverse;
    }
    
    @keyframes floatGlow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }
    
    /* Floating Particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent-gold);
      border-radius: 50%;
      opacity: 0;
      animation: particleFloat 8s ease-in-out infinite;
    }
    
    @keyframes particleFloat {
      0% { opacity: 0; transform: translateY(100vh) scale(0); }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-100px) scale(1); }
    }
    
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px;
      position: relative;
      z-index: 10;
    }
    
    /* Header */
    header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }
    
    .header-decoration {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .decoration-line {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }
    
    .decoration-icon {
      width: 40px;
      height: 40px;
      fill: var(--accent-gold);
      animation: pulse 3s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    
    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: 2px;
      position: relative;
      display: inline-block;
    }
    
    h1::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
      border-radius: 2px;
    }
    
    .subtitle {
      margin-top: 25px;
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 300;
    }
    
    /* Tabs */
    .tabs-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 50px;
    }
    
    .tabs {
      display: flex;
      gap: 16px;
      padding: 8px;
      background: var(--card-bg);
      border-radius: 60px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    
    .tab-btn {
      position: relative;
      padding: 16px 36px;
      font-size: 1.15rem;
      font-weight: 600;
      font-family: 'Cairo', sans-serif;
      background: transparent;
      border: none;
      border-radius: 50px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    
    .tab-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, var(--accent-gold), #b8956e);
      border-radius: 50px;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: -1;
    }
    
    .tab-btn:hover {
      color: var(--text-primary);
      transform: translateY(-2px);
    }
    
    .tab-btn:hover::before {
      opacity: 0.15;
      transform: scale(1);
    }
    
    .tab-btn.active {
      color: var(--bg-primary);
      font-weight: 700;
      box-shadow: 0 8px 30px var(--glow-gold);
    }
    
    .tab-btn.active::before {
      opacity: 1;
      transform: scale(1);
    }
    
    .tab-btn span {
      position: relative;
      z-index: 2;
    }
    
    /* Tab content */
    .tab-content {
      display: none;
      opacity: 0;
      transform: translateY(30px) scale(0.98);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .tab-content.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    
    /* Menu Card */
    .menu-card {
      background: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(212, 165, 116, 0.05) inset;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    
    .menu-card:hover {
      transform: translateY(-5px);
      box-shadow: 
        0 35px 80px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(212, 165, 116, 0.1);
    }
    
    .card-header {
      padding: 20px 30px;
      background: linear-gradient(135deg, rgba(212, 165, 116, 0.1), transparent);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .card-icon {
      width: 32px;
      height: 32px;
      fill: var(--accent-gold);
    }
    
    .card-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-warm);
    }
    
    .menu-image {
      padding: 20px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.3));
    }
    
    .menu-image img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      transition: transform 0.5s ease;
    }
    
    .menu-card:hover .menu-image img {
      transform: scale(1.02);
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 40px 20px;
      margin-top: 60px;
      border-top: 1px solid var(--border-color);
    }
    
    .footer-text {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .tabs {
        flex-direction: column;
        border-radius: 20px;
        gap: 8px;
        width: 100%;
        max-width: 300px;
      }
      
      .tab-btn {
        width: 100%;
        padding: 14px 24px;
        border-radius: 14px;
      }
      
      .tab-btn::before {
        border-radius: 14px;
      }
      
      .card-header {
        padding: 16px 20px;
      }
      
      .card-title {
        font-size: 1.2rem;
      }
      
      .menu-image {
        padding: 15px;
      }
    }
    
    @media (max-width: 480px) {
      h1 {
        font-size: 2.2rem;
      }
      
      .decoration-line {
        width: 50px;
      }
      
      .subtitle {
        font-size: 0.95rem;
      }
    }
    
    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-pattern"></div>
  
  <!-- Floating Particles -->
  <div class="particles" id="particles"></div>

  <div class="container">
    
    <header>
      <div class="header-decoration">
        <div class="decoration-line"></div>
        <svg class="decoration-icon" viewBox="0 0 24 24">
          <path d="M12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2Z"/>
        </svg>
        <div class="decoration-line"></div>
      </div>
      <h1>المنيو</h1>
      <p class="subtitle">اكتشف أشهى المأكولات والمشروبات</p>
    </header>

    <div class="tabs-wrapper">
      <div class="tabs">
        <button class="tab-btn active" data-tab="sahor">
          <span>السحور</span>
        </button>
        <button class="tab-btn" data-tab="drinks">
          <span>المشروبات</span>
        </button>
        <button class="tab-btn" data-tab="desserts">
          <span>الحلويات</span>
        </button>
      </div>
    </div>

    <div id="sahor" class="tab-content active">
      <div class="menu-card">
        <div class="card-header">
          <svg class="card-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93s3.05-7.44 7-7.93v15.86zm2-15.86c3.94.49 7 3.85 7 7.93s-3.05 7.44-7 7.93V4.07z"/>
          </svg>
          <span class="card-title">قائمة السحور</span>
        </div>
        <div class="menu-image">
          <img src="السحور.PNG" alt="منيو السحور">
        </div>
      </div>
    </div>

    <div id="drinks" class="tab-content">
      <div class="menu-card">
        <div class="card-header">
          <svg class="card-icon" viewBox="0 0 24 24">
            <path d="M18.5 3H6c-1.1 0-2 .9-2 2v5.71c0 3.83 2.95 7.18 6.78 7.29 3.96.12 7.22-3.06 7.22-7v-1h.5c1.93 0 3.5-1.57 3.5-3.5S20.43 3 18.5 3zM16 5v3h-2V5h2zm-4 0v3H8V5h4zM6 5v3h-.01L6 5zm12.5 5H18V8h.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5zM6 19h12v2H6z"/>
          </svg>
          <span class="card-title">قائمة المشروبات</span>
        </div>
        <div class="menu-image">
          <img src="المشروبات.PNG" alt="منيو المشروبات">
        </div>
      </div>
    </div>

    <div id="desserts" class="tab-content">
      <div class="menu-card">
        <div class="card-header">
          <svg class="card-icon" viewBox="0 0 24 24">
            <path d="M12 4c3.73 0 6.86 2.55 7.75 6H14c-.55 0-1 .45-1 1v2h-2v-2c0-.55-.45-1-1-1H4.25c.89-3.45 4.02-6 7.75-6zM4.07 14h3.93c.55 0 1-.45 1-1v-2h6v2c0 .55.45 1 1 1h3.93c-.85 3.46-4.03 6-7.93 6s-7.08-2.54-7.93-6zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
          </svg>
          <span class="card-title">قائمة الحلويات</span>
        </div>
        <div class="menu-image">
          <img src="الحلويات.PNG" alt="منيو الحلويات">
        </div>
      </div>
    </div>
    
    <footer>
      <p class="footer-text">نتمنى لكم وجبة شهية</p>
    </footer>
    
  </div>

  <script>
    // Initialize particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      if (!particlesContainer) return;
      
      const particleCount = 15;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = (6 + Math.random() * 4) + 's';
        particlesContainer.appendChild(particle);
      }
    }
    
    // Tab switching
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        // Remove active from all
        tabButtons.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        
        // Add active to clicked
        btn.classList.add('active');
        const targetTab = document.getElementById(btn.dataset.tab);
        if (targetTab) {
          targetTab.classList.add('active');
        }
      });
    });
    
    // Initialize on load
    document.addEventListener('DOMContentLoaded', createParticles);
  </script>

</body>
</html>
